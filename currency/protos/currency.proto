syntax = "proto3";

option go_package = ".;currency";

service Currency {
  rpc GetRate(RateRequest) returns (RateResponse);
}

message RateRequest {
  Currencies Base = 1;
  Currencies Destination = 2;
}

message RateResponse {
  double Rate = 1;
}

enum Currencies {
    EUR=0;
    USD=1;
    JPY=2;
    BGN=3;
    CZK=4;
    DKK=5;
    GBP=6;
    HUF=7;
    PLN=8;
    RON=9;
    SEK=10;
    CHF=11;
    ISK=12;
    NOK=13;
    HRK=14;
    RUB=15;
    TRY=16;
    AUD=17;
    BRL=18;
    CAD=19;
    CNY=20;
    HKD=21;
    IDR=22;
    INR=23;
    KRW=24;
    MXN=25;
    MYR=26;
    NZD=27;
    PHP=28;
    SGD=29;
    THB=30;
    ZAR=31;
}
